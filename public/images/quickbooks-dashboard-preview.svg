<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">Illustrative QuickBooks-style accounting dashboard</title><desc id="desc">A clearly illustrative accounting dashboard with summary cards, an income chart, and invoice rows.</desc>
