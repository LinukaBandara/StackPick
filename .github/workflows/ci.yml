name: StackPick CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report development dependency advisories
        run: |
          npm audit --audit-level=high || echo '::warning::Full dependency audit reports development-tool advisories; review the audit output. Production dependencies are checked separately above.'
      - name: Check internal links
        run: npm run check:links
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.stackpick.tech
          NEXT_PUBLIC_GA_ID: G-6X9SEJMZDV
