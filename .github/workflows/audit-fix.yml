name: Remediate non-breaking dependency advisories

on:
  push:
    branches:
      - security/dev-audit-remediation

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Apply non-breaking npm security fixes
        run: npm audit fix --ignore-scripts --no-fund
      - name: Commit dependency updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No non-breaking dependency updates available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: apply non-breaking dependency audit fixes"
          git push
