name: StackPick uptime check

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"

jobs:
  check-public-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check HTTPS homepage
        run: curl --location --retry 3 --retry-delay 5 --max-time 20 --fail --silent --show-error https://www.stackpick.tech/ -o /dev/null
      - name: Check sitemap
        run: curl --location --retry 3 --retry-delay 5 --max-time 20 --fail --silent --show-error https://www.stackpick.tech/sitemap.xml -o /dev/null
      - name: Check robots.txt
        run: curl --location --retry 3 --retry-delay 5 --max-time 20 --fail --silent --show-error https://www.stackpick.tech/robots.txt -o /dev/null
      - name: Confirm HTTP redirects to HTTPS
        shell: bash
        run: |
          final_url="$(curl --location --retry 2 --max-time 20 --silent --show-error --output /dev/null --write-out '%{url_effective}' http://stackpick.tech/)"
          if [[ "$final_url" != "https://www.stackpick.tech/" ]]; then
            echo "Expected HTTP to redirect to canonical HTTPS https://www.stackpick.tech/; final URL was: $final_url"
            exit 1
          fi
